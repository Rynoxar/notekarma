<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoteKarma</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#151B25">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NoteKarma">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#EAF0F6;--card:#fff;--ink:#16233F;--muted:#5B6B86;--line:#D5DEEA;--accent:#2F5BEA;--on-accent:#fff;--coin:#F4B400;--coin-ink:#3F2E00;--ok:#1E8E5A;--bad:#C23B3B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--card:#16233A;--ink:#E8EEF8;--muted:#9AA9C2;--line:#25365A;--accent:#7AA2FF;--on-accent:#0E1626}}
:root[data-theme="dark"]{--bg:#0E1626;--card:#16233A;--ink:#E8EEF8;--muted:#9AA9C2;--line:#25365A;--accent:#7AA2FF;--on-accent:#0E1626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 80px}
h1,h2{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;letter-spacing:-.02em}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
header h1{font-size:26px;font-weight:800}
.who{display:flex;align-items:center;gap:8px}
.coin{display:flex;align-items:center;gap:6px;background:var(--coin);color:var(--coin-ink);font-weight:700;border-radius:999px;padding:6px 12px;border:0;font-family:inherit;font-size:15px;cursor:pointer}
.coin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--coin-ink);display:inline-block}
.coin.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:500;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:64px;resize:vertical}
button.btn{font:700 15px "DM Sans",sans-serif;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:11px 16px;cursor:pointer}
button.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 14px "DM Sans",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.post .top{height:34px;background:repeating-linear-gradient(var(--card) 0 10px,var(--line) 10px 11px);border-bottom:2px solid hsl(var(--h) 70% 55%)}
.post .body{padding:12px 16px 16px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:hsl(var(--h) 60% 38%);background:hsl(var(--h) 80% 92%);border-radius:6px;padding:2px 8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:hsl(var(--h) 80% 80%);background:hsl(var(--h) 40% 22%)}}
.post h2{font-size:19px;font-weight:600;margin:8px 0 4px}
.post p{margin:0 0 10px;color:var(--muted);font-size:15px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.by{font-size:14px;color:var(--muted)}
.like{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 14px "DM Sans",sans-serif;cursor:pointer}.like.on{background:var(--ink);color:var(--bg)}
.danger{background:var(--bad)!important;color:#fff!important;border:0!important}
.post .top{height:5px;background:hsl(var(--h) 70% 55%);border:0}
.row{margin-bottom:18px}.row h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;font-size:19px;margin:0 0 8px}
.cnt{font:500 13px "DM Sans",sans-serif;color:var(--muted);margin-left:4px}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px}
.strip .post{flex:none;width:270px;margin:0;scroll-snap-align:start}
.pv{display:block;width:100%;height:170px;object-fit:cover;object-position:top;background:var(--line)}
.pv.none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.post .meta{flex-direction:column;align-items:flex-start}.acts{display:flex;gap:8px;flex-wrap:wrap}
.post .btn,.post .like{padding:7px 12px;font-size:14px}.post h2{font-size:17px}
.cm{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}.ci{font-size:14px;margin-bottom:6px;color:var(--ink)}
.cin{display:flex;gap:6px;margin-top:6px}.cin input{flex:1;min-width:0;padding:8px}
.notice{outline:2px solid var(--coin)}.nl{font:700 12px "DM Sans",sans-serif;letter-spacing:1.5px;color:var(--muted);margin-bottom:4px}
.empty.small{text-align:left;padding:4px 0;font-size:14px}
.rb{font:700 11px "DM Sans",sans-serif;background:var(--line);color:var(--ink);border-radius:999px;padding:2px 8px;margin-left:4px}.rb.bad{background:var(--bad);color:#fff}
.nav{display:flex;gap:8px;margin-bottom:12px}.nav select{flex:1;min-width:0}
.badge{font:700 11px "DM Sans",sans-serif;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);margin-left:6px;vertical-align:middle}.badge.bad{background:var(--bad);color:#fff}
main{padding-bottom:96px}#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.vt{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;font-size:24px;margin:6px 0 12px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:6px}.crumb .link{padding:2px}
.picks{display:grid;gap:10px;margin-bottom:12px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:16px;font:700 17px "DM Sans",sans-serif;cursor:pointer}.pick small{font:400 13px "DM Sans",sans-serif;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.grid .post{margin:0}.grid .empty{grid-column:1/-1}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar select{flex:1;min-width:130px;width:auto}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;font-size:14px;color:var(--muted)}.rt b{color:var(--ink)}
.sb{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 1px}.sb.on{color:var(--coin)}
.ci.rp,.cin.rp{margin-left:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{flex:1;background:none;border:0;color:var(--muted);font:500 12px "DM Sans",sans-serif;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tab.on{color:var(--accent);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:24px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;display:none;z-index:9}
.led{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.tab{position:relative}.bdg{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font:700 10px "DM Sans",sans-serif;font-style:normal;border-radius:999px;padding:1px 6px}.badge.ok{background:var(--ok);color:#fff}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:700 13px "DM Sans",sans-serif;flex:none}.av.sm{width:32px;height:32px}.av.lg{width:76px;height:76px;font-size:30px}
.au{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font:700 14px "DM Sans",sans-serif;padding:0 0 8px;cursor:pointer;text-align:left}.avb{background:none;border:0;padding:0;cursor:pointer;display:flex}.ph{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.person{gap:10px}.person small{color:var(--muted);font-weight:400}.tab{font-size:11px}
.seg{display:flex;gap:8px;margin-bottom:12px}.sub{font:800 16px "DM Sans",sans-serif;margin:16px 0 8px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 340px);min-height:220px;overflow-y:auto;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:90%}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-width:96px;overflow-wrap:anywhere}
.msg.me .bub{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.who{font:700 12px "DM Sans",sans-serif;color:var(--muted)}.msg.me .who{display:none}
.mt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;opacity:.8;margin-top:2px}
.dots{background:none;border:0;color:inherit;cursor:pointer;font-size:18px;line-height:1;padding:0 4px}.del{opacity:.85}
.mm{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid currentColor}.mm .link{color:inherit}.chatin{margin-top:8px}
.sl{animation:inL .22s ease-out}.sr{animation:inR .22s ease-out}
@keyframes inL{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}@keyframes inR{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sl,.sr{animation:none}}
#toast{z-index:60}.chead2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wa-row{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;cursor:pointer;color:var(--ink);text-align:left}
.wa-ava{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 20px "DM Sans",sans-serif;flex:none}
.wa-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.wa-top,.wa-bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wa-top b{font:700 16px "DM Sans",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wa-top small{color:var(--muted);font-size:12px;flex:none}.wa-top small.un{color:#00A884;font-weight:700}
.wa-pv{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wa-un{background:#00A884;color:#fff;font:700 12px "DM Sans",sans-serif;border-radius:999px;padding:2px 7px;font-style:normal;flex:none}
.wa{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;flex-direction:column;background:var(--wbg);color:var(--wtx);--wbg:#EFEAE2;--wme:#D9FDD3;--wot:#FFFFFF;--whd:#008069;--wtx:#111B21;--wmt:#667781}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{--wbg:#0B141A;--wme:#005C4B;--wot:#202C33;--whd:#202C33;--wtx:#E9EDEF;--wmt:#8696A0}}
:root[data-theme="dark"] .wa{--wbg:#0B141A;--wme:#005C4B;--wot:#202C33;--whd:#202C33;--wtx:#E9EDEF;--wmt:#8696A0}
.wa-head{display:flex;align-items:center;gap:8px;background:var(--whd);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
.wa-ib{background:none;border:0;color:#fff;padding:6px;cursor:pointer;display:flex;flex:none}.wa-ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wa-av2{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 17px "DM Sans",sans-serif;color:#fff;flex:none}
.wa-title{flex:1;min-width:0;text-align:left;background:none;border:0;color:#fff;font:700 16px "DM Sans",sans-serif;cursor:pointer;display:flex;flex-direction:column;padding:0}.wa-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wa-title small{font:400 12px "DM Sans",sans-serif;opacity:.85}
.wa-log{flex:1;overflow-y:auto;padding:8px 8px;display:flex;flex-direction:column;gap:3px}
.wa-day{align-self:center;margin:8px 0}.wa-day span{background:var(--wot);color:var(--wmt);font:500 12px "DM Sans",sans-serif;padding:4px 10px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.wa-m{display:flex}.wa-m.me{justify-content:flex-end}
.wa-b{max-width:82%;background:var(--wot);color:var(--wtx);border-radius:8px;padding:5px 8px 4px;box-shadow:0 1px 1px rgba(0,0,0,.13);cursor:pointer;overflow-wrap:anywhere}.wa-m.me .wa-b{background:var(--wme)}
.wa-nm{font:700 13px "DM Sans",sans-serif;margin-bottom:1px}.wa-t{white-space:pre-wrap;font-size:15px;line-height:1.35}.wa-ts{float:right;margin:7px 0 0 10px;font-size:11px;color:var(--wmt)}.wa-del{opacity:.75}
.wa-in{display:flex;align-items:center;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.wa-in input{flex:1;min-width:0;border:0;border-radius:24px;padding:12px 16px;background:var(--wot);color:var(--wtx);font-size:16px}
.wa-send{width:46px;height:46px;border-radius:50%;border:0;background:#00A884;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.wa-send svg{width:22px;height:22px;fill:#fff}
.wa-empty{margin:auto;color:var(--wmt);font-size:14px;background:var(--wot);padding:8px 14px;border-radius:10px}
.wa-dlg,.wa-sheet{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:2}
.wa-card{width:100%;background:var(--wot);color:var(--wtx);border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}.wa-card p{margin:4px 8px 10px;color:var(--wmt)}
.wa-opt{display:block;width:100%;text-align:left;background:none;border:0;color:#00A884;font:700 16px "DM Sans",sans-serif;padding:14px 8px;cursor:pointer}
.wa-sheet-in{width:100%;max-height:80vh;overflow-y:auto;background:var(--bg);color:var(--ink);border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.wa-tag{display:inline-block;font:700 10px "DM Sans",sans-serif;line-height:1.4;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.wa-tag.ceo{background:#F4B400;color:#3F2E00}.wa-tag.mgr{background:#2F5BEA;color:#fff}.wa-m.me .wa-nm{text-align:right}
.brand{display:flex;align-items:center;gap:8px}.brand img{border-radius:9px;background:#151B25}
.hero{text-align:center;margin:10px 0 14px}.hero img{width:min(260px,70%);height:auto;border-radius:20px}
.install{display:flex;align-items:center;gap:12px}.install img{border-radius:12px;flex:none}
.adm-h{margin-bottom:10px}.adm-h h2{font-size:22px}.adm-h small{color:var(--muted)}
.adm-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.adm-tabs .chip{white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}.stat span{font-size:13px;color:var(--muted)}.stat b{font:800 28px "Bricolage Grotesque","DM Sans",sans-serif}.stat small{font-size:12px;color:var(--muted)}
.card2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.card2 h3{margin:0 0 8px;font:800 17px "Bricolage Grotesque","DM Sans",sans-serif}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.mem{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}.mem-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.mem-n{flex:1;min-width:0;display:flex;flex-direction:column}.mem-n small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mem-k{font-weight:700;color:var(--muted)}
.mem-d{padding:4px 12px 14px;border-top:1px solid var(--line)}.mem-g{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}.mem-g span{color:var(--muted)}
.mem-a{display:flex;flex-direction:column;gap:10px}.dz{border:1px solid var(--bad);border-radius:12px;padding:12px;margin-top:4px}.dz p{margin:4px 0 8px}.cin select{flex:1;min-width:0}
a.btn{display:inline-block;text-decoration:none;font:700 15px "DM Sans",sans-serif;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:11px 16px}a.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* ---- design layer: depth, motion, World theme ---- */
body.world{--accent:#0E8F7A}
@media (prefers-color-scheme:dark){body.world{--accent:#4FD1B5}}
body{background:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%),radial-gradient(760px 360px at 100% 0,rgba(244,180,0,.09),transparent 58%),var(--bg);background-attachment:fixed;transition:background-color .4s}
header{position:sticky;top:0;z-index:6;margin:0 -16px 6px;padding:10px 16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header h1.brand{font-size:24px;letter-spacing:-.03em}
.vt{letter-spacing:-.02em}.wh .sub2{color:var(--muted);margin:0 0 14px;font-size:15px;line-height:1.5}
button.btn{transition:transform .15s ease,box-shadow .25s ease,filter .25s ease}
button.btn:not(.alt):not(.danger){background-image:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#fff))}
button.btn:active,.pick:active,.chip:active{transform:scale(.96)}
.post,.panel,.card2,.stat,.mem,.bcard,.pick{box-shadow:0 1px 2px rgba(10,20,40,.06),0 10px 28px rgba(10,20,40,.07);transition:transform .22s ease,box-shadow .25s ease,border-color .25s ease}
@media (hover:hover){button.btn:not(.alt):not(.danger):hover{filter:brightness(1.07);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}.post:hover,.pick:hover,.bcard:hover,.stat:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(10,20,40,.14)}.pick:hover{border-color:var(--accent)}}
.coin{animation:pulse 2.8s ease-out infinite}
.modewrap{display:flex;justify-content:center;margin:2px 0 14px}
.modesw{position:relative;display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 4px 16px rgba(10,20,40,.08)}
.ms{position:relative;z-index:1;background:none;border:0;padding:8px 22px;font:700 14px "DM Sans",sans-serif;color:var(--muted);border-radius:999px;cursor:pointer;transition:color .25s}
.ms.on{color:var(--on-accent)}

function roomListHTML(){var mine=S.rooms.filter(function(r){return isMember(r.id)}).sort(function(a,b){var x=roomMsgs(a.id)[0],y=roomMsgs(b.id)[0];return new Date(y?y.created_at:b.created_at)-new Date(x?x.created_at:a.created_at)});return mine.length?mine.map(roomRow).join(""):'<div class="empty small">No chats yet. Create a group, or join one below.</div>'}
function roomsHTML(){var more=S.rooms.filter(function(r){return !isMember(r.id)&&(r.is_public||S.staff)});
var h='<div class="chead2"><h2 class="vt" style="margin:0">Chats</h2><button class="btn" onclick="roomForm=!roomForm;render()">'+(roomForm?'Close':'New group')+'</button></div>';
if(roomForm)h+='<div class="panel"><label for="rn">Group name</label><input id="rn" maxlength="40" placeholder="Example: BCA Sem 3 study group"><label for="ra">About (optional)</label><input id="ra" maxlength="120" placeholder="What is this group for?"><label for="rv">Who can join?</label><select id="rv"><option value="0">Private: only people with the invite code</option><option value="1">Public: anyone can find and join</option></select><div style="margin-top:12px"><button class="btn" onclick="createRoom()">Create group</button></div></div>';
h+='<div class="cin" style="margin-bottom:10px"><input id="jc" maxlength="12" placeholder="Have an invite code?" aria-label="Invite code" autocapitalize="characters"><button class="btn alt" onclick="joinCode()">Join with code</button></div><div id="roomlist">'+roomListHTML()+'</div>';
if(more.length)h+='<h3 class="sub">'+(S.staff?'Other groups':'Groups you can join')+'</h3>'+more.map(function(r){return'<div class="led" style="gap:8px"><span><b>'+esc(r.name)+'</b>'+(r.is_public?'':' <small>(private)</small>')+'<br><small style="color:var(--muted)">'+esc(r.about||"")+' | '+mcount(r.id)+' members</small></span>'+(r.is_public?'<button class="btn" onclick="joinRoom(\''+r.id+'\')">Join</button>':'<button class="btn alt" onclick="openRoom(\''+r.id+'\')">Open</button>')+'</div>'}).join("");
return h}
function createRoom(){var n=document.getElementById("rn").value.trim(),a=document.getElementById("ra").value.trim(),pub=document.getElementById("rv").value==="1";if(n.length<2){toast("Group name needs at least 2 characters.");return}sb.rpc("create_room",{p_name:n,p_about:a,p_public:pub}).then(done).then(function(r){roomForm=false;return loadAll().then(function(){openRoom(r.data)})}).catch(fail)}
function joinCode(){var el=document.getElementById("jc"),c=el?el.value.trim():"";if(!c){toast("Type the invite code.");return}sb.rpc("join_by_code",{p_code:c}).then(done).then(function(r){return loadAll().then(function(){toast("Joined the group.");openRoom(r.data)})}).catch(fail)}
function joinRoom(id){sb.rpc("join_room",{p_room:id}).then(done).then(loadAll).then(function(){toast("Joined the group.");openRoom(id)}).catch(fail)}
function leaveRoom(id){if(!confirm("Leave this group?"))return;sb.rpc("leave_room",{p_room:id}).then(done).then(function(){roomId=null;showMembers=false;return reload("You left the group.")}).catch(fail)}
function delRoom(id){if(!confirm("Delete this group and all its messages for everyone?"))return;sb.from("chat_rooms").delete().eq("id",id).then(done).then(function(){roomId=null;showMembers=false;return reload("Group deleted.")}).catch(fail)}
function addMember(u){sb.rpc("add_room_member",{p_room:roomId,p_user:u}).then(done).then(function(){return reload("Added to the group.")}).catch(fail)}
function removeMember(u){if(!confirm("Remove this person from the group?"))return;sb.rpc("remove_room_member",{p_room:roomId,p_user:u}).then(done).then(function(){return reload("Removed from the group.")}).catch(fail)}
function openRoom(id){animNext=true;tab="people";peopleTab="groups";roomId=id;showMembers=false;msgMenu=null;chatMsgs=[];chatHidden={};chatDraft="";chatSig="";markRead(id);window.scrollTo(0,0);render();fetchMsgs(true)}
function closeRoom(){animNext=true;roomId=null;showMembers=false;render();loadChatPrev().then(paintRooms)}
function addResHTML(){var r=roomOf(roomId),ql=addQ.trim().toLowerCase();if(!r||!ql)return'<div class="note">Type a name to find people.</div>';var cs=S.cards.filter(function(c){return !S.rmembers.some(function(m){return m.room_id===roomId&&m.user_id===c.id})&&String(c.name||"").toLowerCase().indexOf(ql)>-1}).slice(0,8);return cs.length?cs.map(function(c){return'<div class="led" style="align-items:center">'+'<span style="display:flex;gap:8px;align-items:center">'+avHTML(c.id,c.name,"sm")+esc(c.name||"Student")+'</span><button class="btn alt" data-a="'+esc(c.id)+'" onclick="addMember(this.dataset.a)">Add</button></div>'}).join(""):'<div class="note">No one found.</div>'}
function membersHTML(r){var ms=S.rmembers.filter(function(m){return m.room_id===r.id}),mod=canMod(r),h='<div class="panel"><h2 style="font-size:17px;margin-bottom:6px">Members ('+ms.length+')</h2>'+ms.map(function(m){var owner=m.user_id===r.created_by;return'<div class="led" style="align-items:center"><span style="display:flex;gap:8px;align-items:center">'+avHTML(m.user_id,"",'sm')+esc(uname(m.user_id,"Student"))+tagHTML(m.user_id)+(owner?' <span class="badge">Owner</span>':'')+'</span>'+(mod&&!owner?'<button class="btn danger" data-a="'+esc(m.user_id)+'" onclick="removeMember(this.dataset.a)">Remove</button>':'')+'</div>'}).join("");
if(mod)h+='<p class="note" style="margin:12px 0 0">'+(r.invite_code?'Invite code: <b style="font-size:18px;letter-spacing:2px">'+esc(r.invite_code)+'</b><br>Share this code with the people you want in this group. They tap Join with code on the Chats screen.':'Invite code will appear here after the database update.')+'</p>';
h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+(isMember(r.id)&&r.created_by!==uid()?'<button class="btn alt" onclick="leaveRoom(\''+r.id+'\')">Leave group</button>':'')+(mod?'<button class="btn danger" onclick="delRoom(\''+r.id+'\')">Delete group</button>':'')+'</div></div>';return h}
function chatScreen(){var r=roomOf(roomId);if(!r){roomId=null;return""}var im=isMember(r.id);
return'<div class="wa"><div class="wa-head"><button class="wa-ib" onclick="closeRoom()" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="wa-av2" style="background:hsl('+hue(r.id)+' 45% 36%)">'+esc(String(r.name).trim().charAt(0).toUpperCase())+'</span><button class="wa-title" onclick="showMembers=true;render()"><span>'+esc(r.name)+'</span><small>'+mcount(r.id)+' members'+(r.is_public?'':' | private')+'</small></button><button class="wa-ib" onclick="showMembers=true;render()" aria-label="Group info"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div><div id="chatlog" class="wa-log" aria-live="polite">'+chatLogHTML()+'</div>'
+(im?'<div class="wa-in"><input id="cmsg" maxlength="1000" placeholder="Message" aria-label="Message" value="'+esc(chatDraft)+'" oninput="chatDraft=this.value" onkeydown="if(event.key===\'Enter\')sendMsg()"><button class="wa-send" onclick="sendMsg()" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l11 2-11 2z"/></svg></button></div>':'<p class="note" style="padding:10px 14px;margin:0;background:var(--card)">You are viewing this group as staff.</p>')
+(showMembers?'<div class="wa-sheet" onclick="showMembers=false;render()"><div class="wa-sheet-in" onclick="event.stopPropagation()">'+membersHTML(r)+'<button class="btn alt" style="margin-top:10px;width:100%" onclick="showMembers=false;render()">Close</button></div></div>':'')+'<div id="wadlg"></div></div>'}
function chatLogHTML(){var ms=chatMsgs.filter(function(m){return !chatHidden[m.id]});if(!ms.length)return'<div class="wa-empty">No messages yet. Say hello.</div>';
var h="",last="",today=new Date().toDateString(),yest=new Date(Date.now()-864e5).toDateString();
ms.forEach(function(m,i){var t=new Date(m.created_at),ds=isNaN(t)?"":t.toDateString();if(ds&&ds!==last){last=ds;h+='<div class="wa-day"><span>'+(ds===today?"Today":ds===yest?"Yesterday":t.toLocaleDateString([],{day:"numeric",month:"long",year:"numeric"}))+'</span></div>'}
var mine=m.user_id===uid(),first=!i||ms[i-1].user_id!==m.user_id||(ms[i-1].created_at&&new Date(ms[i-1].created_at).toDateString()!==ds),tm=isNaN(t)?"":t.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),tg=tagHTML(m.user_id),nl=(!mine&&(first||tg))?'<div class="wa-nm" style="color:hsl('+hue(m.user_id)+' 70% 62%)">'+esc(uname(m.user_id,m.user_name))+tg+'</div>':(mine&&tg?'<div class="wa-nm">'+tg+'</div>':''),body=m.deleted?'<i class="wa-del">'+(mine?"You deleted this message":"This message was deleted")+'</i>':esc(m.body);
h+='<div class="wa-m'+(mine?' me':'')+'"><div class="wa-b" data-a="'+esc(m.id)+'" onclick="msgDialog(this.dataset.a)">'+nl+'<span class="wa-t">'+body+'</span><span class="wa-ts">'+esc(tm)+'</span></div></div>'});return h}
function paintChat(force){var el=document.getElementById("chatlog");if(!el)return;var near=el.scrollHeight-el.scrollTop-el.clientHeight<80;el.innerHTML=chatLogHTML();if(force||near)el.scrollTop=el.scrollHeight}
function fetchMsgs(force){var rid=roomId;if(!rid)return Promise.resolve();return Promise.all([sb.from("chat_messages").select("*").eq("room_id",rid).order("created_at",{ascending:false}).limit(200),sb.from("chat_hidden").select("message_id")]).then(function(r){if(rid!==roomId)return;var ms=(r[0].error?[]:(r[0].data||[])).slice().reverse(),hid={};(r[1].error?[]:(r[1].data||[])).forEach(function(x){hid[x.message_id]=1});var sg=ms.map(function(m){return m.id+(m.deleted?"d":"")}).join(",")+"|"+Object.keys(hid).length;if(force||sg!==chatSig){chatSig=sg;chatMsgs=ms;chatHidden=hid;markRead(rid);paintChat(force)}}).catch(function(){})}
function sendMsg(){var el=document.getElementById("cmsg");if(!el||blocked())return;var b=el.value.trim();if(!b||Date.now()-lastSend<600)return;lastSend=Date.now();el.value="";chatDraft="";sb.from("chat_messages").insert({room_id:roomId,user_id:uid(),user_name:myName(),body:b.slice(0,1000)}).then(done).then(function(){return fetchMsgs(true)}).catch(function(e){el.value=b;chatDraft=b;fail(e)})}
function msgDialog(id){var m=chatMsgs.filter(function(x){return x.id===id})[0],el=document.getElementById("wadlg");if(!m||!el)return;var mod=canMod(roomOf(roomId)),mine=m.user_id===uid();el.innerHTML='<div class="wa-dlg" onclick="closeDlg()"><div class="wa-card" onclick="event.stopPropagation()"><p>Delete message?</p><button class="wa-opt" onclick="hideMsg(\''+id+'\')">Delete for me</button>'+(mine&&!m.deleted?'<button class="wa-opt" onclick="delMsgAll(\''+id+'\')">Delete for everyone</button>':'')+'<button class="wa-opt" onclick="closeDlg()">Cancel</button></div></div>'}
function closeDlg(){var el=document.getElementById("wadlg");if(el)el.innerHTML=""}
function hideMsg(id){closeDlg();chatHidden[id]=1;chatHid[id]=1;paintChat(false);sb.from("chat_hidden").insert({user_id:uid(),message_id:id}).then(function(r){if(r.error){delete chatHidden[id];delete chatHid[id];fail(r.error);paintChat(false)}})}
function delMsgAll(id){closeDlg();sb.rpc("delete_message_everyone",{p_msg:id}).then(done).then(function(){return fetchMsgs(true)}).catch(fail)}
function swipeNav(d){var a=document.getElementById("app"),cls="";if(d==="left"&&tab==="notes"){tab="people";roomId=null;cls="sl"}else if(d==="right"&&tab==="people"){if(roomId){roomId=null;showMembers=false}else tab="notes";cls="sr"}else return;window.scrollTo(0,0);render();if(a&&a.classList){a.classList.remove("sl","sr");void a.offsetWidth;a.classList.add(cls)}}
var tsX=0,tsY=0,tsT=0,tsOk=false;
document.addEventListener("touchstart",function(e){var t=e.touches[0];tsX=t.clientX;tsY=t.clientY;tsT=Date.now();var el=e.target;tsOk=!(el&&el.closest&&el.closest("input,textarea,select,.strip,.chips,.wa-in"))},{passive:true});
document.addEventListener("touchend",function(e){if(!tsOk||!S.me||blocked())return;var t=e.changedTouches[0],dx=t.clientX-tsX,dy=t.clientY-tsY;if(Date.now()-tsT>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;swipeNav(dx<0?"left":"right")},{passive:true});
setInterval(function(){if(!S.me||document.hidden||busy)return;if(tab==="people"&&peopleTab==="groups"&&roomId)fetchMsgs(false)},3000);
var deferredInstall=null;
function isStandalone(){return !!((window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||(typeof navigator!=="undefined"&&navigator.standalone===true))}
function installHTML(){if(isStandalone())return"";var ios=typeof navigator!=="undefined"&&/iphone|ipad|ipod/i.test(navigator.userAgent||"");return'<div class="panel install"><img src="icon-192.png" alt="" width="52" height="52"><div style="flex:1"><b>Get the NoteKarma app</b><div class="note" style="margin:2px 0 0">'+(ios?'On iPhone: tap the Share button, then Add to Home Screen.':deferredInstall?'Install it like a normal app. No Play Store needed.':'Open the Chrome menu (three dots), then tap Install app or Add to Home screen.')+'</div></div>'+(deferredInstall?'<button class="btn" onclick="installApp()">Install</button>':'')+(apkOk?'<a class="btn alt" href="notekarma.apk" download>Android APK</a>':'')+'</div>'}
function paintInstall(){var e=document.getElementById("inst");if(e)e.innerHTML=installHTML()}
function installApp(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;paintInstall()},function(){})}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredInstall=e;paintInstall()});
window.addEventListener("appinstalled",function(){deferredInstall=null;paintInstall();toast("NoteKarma app installed.")});
fetch("notekarma.apk",{method:"HEAD"}).then(function(r){if(r.ok){apkOk=true;paintInstall()}}).catch(function(){});
setTimeout(function(){var sp=document.getElementById("splash");if(sp){sp.classList.add("hide");setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},600)}},1100);
</script>
