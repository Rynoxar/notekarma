if(showLed){h+='<div class="panel"><h2 style="font-size:18px;margin-bottom:6px">Karma history</h2>';S.ledger.filter(function(e){return e.user_name===uid()}).sort(function(a,b){return b.id-a.id}).forEach(function(e){h+='<div class="led"><span>'+esc(e.why)+'</span><span class="'+(e.delta>0?'pos':'neg')+'">'+(e.delta>0?'+':'')+e.delta+'</span></div>'});h+='</div>'}
h+='<div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showForm=!showForm;render()">'+(showForm?'Close':'Share your notes')+'</button><button class="btn alt" onclick="showTop=!showTop;render()">Top contributors</button>'+(S.admin?'<button class="btn alt" onclick="showAdm=!showAdm;render()">CEO panel</button>':'')+'</div>';
if(showAdm&&S.admin)h+=admHTML();if(showTop)h+=topHTML();
var names=subjectNames();
if(showForm){h+='<div class="panel"><label for="pt">Title</label><input id="pt" maxlength="80"><label for="ps">Subject</label><select id="ps">'+names.map(function(s){return'<option>'+esc(s)+'</option>'}).join("")+'</select><label for="pn">Or add a new subject</label><input id="pn" placeholder="Type a new subject name" maxlength="30"><label for="pu">Unit</label><input id="pu" placeholder="Unit 2" maxlength="20"><label for="pd">Short description</label><textarea id="pd" maxlength="200"></textarea><label for="pf">Notes (PDF, up to 5 MB)</label><input id="pf" type="file" accept="application/pdf"><p class="note">Viewers will see a preview of your first page before downloading.</p><div style="margin-top:14px"><button class="btn" onclick="submitPost()">Post notes</button></div></div>'}
h+='<div class="chips" role="group" aria-label="Filter by subject">'+["All"].concat(names).map(function(s){return'<button class="chip" aria-pressed="'+(filter===s)+'" data-s="'+esc(s)+'" onclick="setFilter(this.dataset.s)">'+esc(s)+'</button>'}).join("")+'</div>';
h+='<input id="q" type="search" placeholder="Search notes, subject or name" aria-label="Search notes" value="'+esc(q)+'" oninput="q=this.value;document.getElementById(\'list\').innerHTML=postsHTML()" style="margin-bottom:12px"><div id="list">'+postsHTML()+'</div>';
h+='<p class="note">Live feed: everyone using this link sees the same notes.</p>';
app.innerHTML=h}
var stored=null;
document.getElementById("app").innerHTML='<p class="empty">Loading...</p>';
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s){S.me=s.user;return loadAll()}}).then(render).catch(function(e){fail(e);render()});
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"){S.me=null;render()}});
setInterval(function(){if(!S.me||document.hidden||busy)return;loadAll().then(refresh).catch(function(){})},8000);
</script>
</body>
