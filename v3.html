function rInfo(id){var a=S.ratings.filter(function(r){return r.post_id===id}),n=a.length,t=a.reduce(function(x,r){return x+r.stars},0);return{n:n,avg:n?t/n:0,mine:(a.filter(function(r){return r.user_id===uid()})[0]||{}).stars||0}}
function canRate(p){return p.author!==uid()&&!blocked()&&(S.admin||S.unlocks.some(function(u){return u.post_id===p.id&&u.user_name===uid()}))}
function rate(id,n){var a=S.ratings.filter(function(r){return r.post_id===id&&r.user_id===uid()})[0];if(a)a.stars=n;else S.ratings.push({post_id:id,user_id:uid(),stars:n});render();sb.from("ratings").upsert({post_id:id,user_id:uid(),stars:n},{onConflict:"post_id,user_id"}).then(function(r){if(r.error){fail(r.error);loadAll().then(render)}})}
function starsHTML(p){var r=rInfo(p.id),h='<div class="rate"><span class="rt">'+(r.n?'<b>'+r.avg.toFixed(1)+'</b> &#9733; ('+r.n+')':'No ratings yet')+'</span>';if(canRate(p)){h+='<span role="group" aria-label="Rate this note">';for(var i=1;i<=5;i++)h+='<button class="sb'+(i<=r.mine?' on':'')+'" onclick="rate(\''+p.id+'\','+i+')" aria-label="Rate '+i+' stars">&#9733;</button>';h+='</span>'}else if(p.author!==uid()&&!S.admin)h+='<span class="note" style="margin:0">Download to rate</span>';return h+'</div>'}
function cmHTML(p){var cs=S.comments.filter(function(c){return c.post_id===p.id}),top=cs.filter(function(c){return !c.parent_id});
function one(c,isRep){return'<div class="ci'+(isRep?' rp':'')+'"><b>'+esc(c.user_name)+':</b> '+esc(c.body)+(isRep?'':' <button class="link" onclick="toggleRep(\''+c.id+'\')">Reply</button>')+((S.admin||c.user_id===uid())?' <button class="link" onclick="delComment(\''+c.id+'\')" aria-label="Delete comment">x</button>':'')+'</div>'}
return'<div class="cm">'+top.map(function(c){return one(c,false)+cs.filter(function(r){return r.parent_id===c.id}).map(function(r){return one(r,true)}).join("")+(rep[c.id]?'<div class="cin rp"><input id="ri-'+c.id+'" placeholder="Write a reply" maxlength="300"><button class="btn" onclick="addReply(\''+p.id+'\',\''+c.id+'\')">Send</button></div>':'')}).join("")+'<div class="cin"><input id="ci-'+p.id+'" placeholder="Write a comment" maxlength="300"><button class="btn" onclick="addComment(\''+p.id+'\')">Send</button></div></div>'}
function cardHTML(p){var own=p.author===uid(),got=own||S.admin||S.unlocks.some(function(u){return u.post_id===p.id&&u.user_name===uid()}),lbl=own?"Download (yours)":S.admin?"Download (CEO)":got?"Download again":"Download for "+COST+" karma",ls=S.likes.filter(function(l){return l.post_id===p.id}),liked=ls.some(function(l){return l.user_name===uid()}),nc=S.comments.filter(function(c){return c.post_id===p.id}).length,op=!!open[p.id],sv=isBm(p.id);
var img=p.preview_path?'<img class="pv" loading="lazy" src="'+esc(pubUrl(p.preview_path))+'" alt="Preview of the first page">':'<div class="pv none">No preview</div>';
return'<article class="post" style="--h:'+hue(p.subject||"")+'"><div class="top"></div>'+img+'<div class="body"><span class="tag">'+esc(p.subject)+' - '+esc(p.unit)+'</span><h2>'+esc(p.title)+'</h2><p>'+esc(p.descr)+'</p>'+starsHTML(p)+'<div class="meta"><span class="by">'+esc(pname(p))+(p.file_path?'':' (sample)')+'</span><span class="acts"><button class="like'+(liked?' on':'')+'" onclick="like(\''+p.id+'\')" aria-pressed="'+liked+'">&#9829; '+ls.length+'</button><button class="like'+(sv?' on':'')+'" onclick="bm(\''+p.id+'\')" aria-pressed="'+sv+'">'+(sv?'Saved':'Save')+'</button><button class="like'+(op?' on':'')+'" onclick="toggleCm(\''+p.id+'\')" aria-expanded="'+op+'">Comments '+nc+'</button><button class="btn'+(got?' alt':'')+'" onclick="download(\''+p.id+'\')">'+lbl+'</button>'+((S.admin||own)?'<button class="btn danger" onclick="delPost(\''+p.id+'\')">Delete</button>':'')+'</span></div>'+(op?cmHTML(p):'')+'</div></article>'}
function postsHTML(){var ql=q.trim().toLowerCase();
function hit(p){return !ql||((p.title||"")+" "+(p.descr||"")+" "+pname(p)+" "+(p.unit||"")+" "+(p.subject||"")).toLowerCase().indexOf(ql)>-1}
var list=tab==="saved"?S.posts.filter(function(p){return isBm(p.id)&&hit(p)}):bPosts().filter(function(p){return p.subject===sid&&hit(p)});
if(tab!=="saved"){if(minr)list=list.filter(function(p){return rInfo(p.id).avg>=minr});
if(sort==="top")list.sort(function(a,b){var x=rInfo(a.id),y=rInfo(b.id);return y.avg-x.avg||y.n-x.n});else if(sort==="likes")list.sort(function(a,b){return S.likes.filter(function(l){return l.post_id===b.id}).length-S.likes.filter(function(l){return l.post_id===a.id}).length})}
if(!list.length)return'<div class="empty">'+(tab==="saved"?'Nothing saved yet. Tap Save on any note to find it quickly before exams.':ql||minr?'No notes match your search or rating filter.':'No notes in this subject yet. Be the first to share.')+'</div>';
return list.map(cardHTML).join("")}
function noticesHTML(){return S.notices.map(function(n){return'<div class="panel notice"><div class="nl">NOTICE</div><div>'+esc(n.body)+'</div><div class="note">'+esc(dt(n.created_at))+(S.admin?' <button class="link" onclick="delNotice(\''+n.id+'\')">remove</button>':'')+'</div></div>'}).join("")}
function topHTML(){var m={};bPosts().forEach(function(p){var k=p.author;m[k]=m[k]||{u:pname(p),n:0,k:0};m[k].n++});S.ledger.forEach(function(e){if(e.delta>0&&String(e.why).indexOf("Your note")===0&&m[e.user_name])m[e.user_name].k+=e.delta});
var r=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.k-a.k||b.n-a.n}).slice(0,5);
return'<div class="panel" id="top"><h2 style="font-size:18px;margin-bottom:6px">Top contributors</h2>'+(r.length?r.map(function(x,i){return'<div class="led"><span>'+(i+1)+'. '+esc(x.u)+'</span><span>'+x.n+' notes, '+x.k+' karma earned</span></div>'}).join(""):'<div class="empty">No posts yet.</div>')+'</div>'}
function reqHTML(){var rs=S.requests.filter(function(r){return r.branch_id===bid});return'<div class="panel"><h2 style="font-size:18px;margin-bottom:4px">Note requests</h2><p class="note" style="margin:0 0 8px">Ask classmates in this branch for notes you need.</p><textarea id="rq" maxlength="300" placeholder="Example: Need Unit 3 Maths solved examples"></textarea><div style="margin:8px 0 12px"><button class="btn" onclick="addReq()">Post request</button></div>'+(rs.length?rs.map(function(r){var mine=r.user_id===uid();return'<div class="led" style="flex-wrap:wrap;gap:6px"><span style="flex:1 1 100%">'+(r.done?'<s>':'')+esc(r.body)+(r.done?'</s>':'')+'<br><small style="color:var(--muted)">'+esc(r.user_name)+' | '+esc(dt(r.created_at))+(r.done?' | fulfilled':'')+'</small></span>'+((mine||S.staff)?'<span style="display:flex;gap:6px"><button class="btn alt" onclick="doneReq(\''+r.id+'\','+(!r.done)+')">'+(r.done?'Reopen':'Mark done')+'</button><button class="btn danger" onclick="delReq(\''+r.id+'\')">Delete</button></span>':'')+'</div>'}).join(""):'<div class="empty small">No requests yet.</div>')+'</div>'}
function delBranch(id){var b=S.branches.filter(function(x){return x.id===id})[0];if(!b)return;var n=S.posts.filter(function(p){return p.branch_id===id}).length;if(n){toast("This branch still has "+n+" notes. Delete those notes first.");return}if(!confirm("Remove branch "+b.name+"? Its subjects and requests will be removed too."))return;sb.from("branches").delete().eq("id",id).then(done).then(function(){return reload("Branch removed.")}).catch(fail)}
function delCollege(id){var c=S.colleges.filter(function(x){return x.id===id})[0];if(!c)return;var ids=S.branches.filter(function(b){return b.college_id===id}).map(function(b){return b.id});var n=S.posts.filter(function(p){return ids.indexOf(p.branch_id)>-1}).length;if(n){toast("This college still has "+n+" notes. Delete those notes first.");return}if(!confirm("Remove college "+c.name+" with all its branches?"))return;sb.from("colleges").delete().eq("id",id).then(done).then(function(){return reload("College removed.")}).catch(fail)}
function manageHTML(){var h='<p class="note" style="margin:14px 0 4px">Colleges (Remove deletes one added by mistake)</p>'+(S.colleges.length?S.colleges.map(function(c){return'<div class="led"><span>'+esc(c.name)+(c.id===cid?' (selected)':'')+'</span><button class="btn danger" onclick="delCollege(\''+c.id+'\')">Remove</button></div>'}).join(""):'<div class="empty small">No colleges yet.</div>');var bl=S.branches.filter(function(b){return b.college_id===cid});return h+'<p class="note" style="margin:14px 0 4px">Branches in the selected college</p>'+(bl.length?bl.map(function(b){return'<div class="led"><span>'+esc(b.name)+'</span><button class="btn danger" onclick="delBranch(\''+b.id+'\')">Remove</button></div>'}).join(""):'<div class="empty small">No branches yet.</div>')}
function actOf(u){var id=u.id;return{posts:S.posts.filter(function(p){return p.author===id}).length,dl:S.unlocks.filter(function(x){return x.user_name===id}).length,cm:S.comments.filter(function(c){return c.user_id===id}).length,lk:S.likes.filter(function(l){return l.user_name===id}).length,rq:S.requests.filter(function(r){return r.user_id===id}).length}}
function admHTML(){var rows=S.users.map(function(u){var a=actOf(u);a.total=a.posts+a.dl+a.cm+a.lk+a.rq;return{u:u,a:a}});var inactive=rows.filter(function(x){return x.a.total===0}).length;
if(admView==="inactive")rows=rows.filter(function(x){return x.a.total===0});
var h='<div class="panel"><h2 style="font-size:18px;margin-bottom:4px">'+(S.admin?'CEO panel':'Manager panel')+'</h2><label for="nc">Add a college</label><div class="cin"><input id="nc" maxlength="60" placeholder="College name"><button class="btn" onclick="addCollege()">Add</button></div><label for="nb">Add a branch to the selected college</label><div class="cin"><input id="nb" maxlength="40" placeholder="Example: BCA, BBA, B.Tech"><button class="btn" onclick="addBranch()">Add</button></div>';
h+=manageHTML();
if(S.admin)h+='<label for="nt">Post a notice for all users</label><textarea id="nt" maxlength="400"></textarea><div style="margin-top:8px"><button class="btn" onclick="postNotice()">Post notice</button></div>';
h+='<p class="note" style="margin:16px 0 6px">'+S.users.length+' members | '+inactive+' inactive (no activity yet) | '+S.posts.length+' notes</p><div style="display:flex;gap:6px;margin-bottom:6px"><button class="chip" aria-pressed="'+(admView==="all")+'" onclick="admView=\'all\';render()">All members</button><button class="chip" aria-pressed="'+(admView==="inactive")+'" onclick="admView=\'inactive\';render()">Inactive only</button></div>';
h+=rows.map(function(x){var u=x.u,a=x.a,self=u.id===uid(),isMgr=u.role==="manager",lock=isMgr&&!S.admin;return'<div class="led" style="flex-wrap:wrap;gap:8px"><span style="flex:1 1 100%">'+esc(u.name||"")+(isMgr?'<span class="badge">Manager</span>':'')+(u.blocked?'<span class="badge bad">Blocked</span>':'')+(a.total===0?'<span class="badge bad">Inactive</span>':'')+'<br><small style="color:var(--muted)">'+esc(u.email)+' | '+bal(u.id)+' karma<br>Joined '+esc(dt(u.created_at))+' | Last seen '+esc(dt(u.last_seen))+'<br>'+a.posts+' notes, '+a.dl+' downloads, '+a.cm+' comments, '+a.lk+' likes, '+a.rq+' requests</small></span>'+(self?'<span class="note">You</span>':lock?'<span class="note">Manager (only CEO can change)</span>':'<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+(S.admin?'<input id="g-'+u.id+'" type="number" placeholder="Karma" aria-label="Karma amount" style="width:90px"><button class="btn alt" onclick="giveKarma(\''+u.id+'\')">Give</button><button class="btn alt" onclick="setRole(\''+u.id+'\',\''+(isMgr?'user':'manager')+'\')">'+(isMgr?'Remove manager':'Make manager')+'</button>':'')+'<button class="btn'+(u.blocked?' alt':' danger')+'" onclick="toggleBlock(\''+u.id+'\')">'+(u.blocked?'Unblock':'Block')+'</button><button class="btn danger" onclick="removeUser(\''+u.id+'\')">Remove</button></span>')+'</div>'}).join("");
return h+'</div>'}
function setFilter(f){filter=f;render()}
function keepScroll(fn){var sx=[].map.call(document.querySelectorAll(".strip"),function(s){return s.scrollLeft}),sy=window.scrollY;fn();[].forEach.call(document.querySelectorAll(".strip"),function(s,i){s.scrollLeft=sx[i]||0});window.scrollTo(0,sy)}
function refresh(){var a=document.activeElement;if(a&&a.closest&&a.closest("#list"))return;var b=document.getElementById("bal");if(b)b.textContent=balTxt();var n=document.getElementById("notices");if(n)n.innerHTML=noticesHTML();var l=document.getElementById("list");if(l&&sig!==refresh.last){refresh.last=sig;keepScroll(function(){l.innerHTML=postsHTML()})}var t=document.getElementById("top");if(t)t.outerHTML=topHTML()}
function render(){keepScroll(draw);refresh.last=sig}
function addSubject(){var n=document.getElementById("ns").value.trim().replace(/\s+/g," ").slice(0,30);if(!n){toast("Type the subject name.");return}var ex=subjectNames().filter(function(x){return x.toLowerCase()===n.toLowerCase()})[0];if(ex){pickSubject(ex);return}sb.from("subjects").insert({name:n,branch_id:bid}).then(done).then(loadAll).then(function(){sid=n;saveSel();toast("Subject added.");render()}).catch(fail)}
function nm(list,id){var x=list.filter(function(i){return i.id===id})[0];return x?x.name:""}
function crumb(){var h='<div class="crumb"><button class="link" onclick="backTo(0)">Colleges</button>';if(cid)h+=' &rsaquo; <button class="link" onclick="backTo(1)">'+esc(nm(S.colleges,cid))+'</button>';if(bid)h+=' &rsaquo; <button class="link" onclick="backTo(2)">'+esc(nm(S.branches,bid))+'</button>';if(sid)h+=' &rsaquo; <b>'+esc(sid)+'</b>';return h+'</div>'}
function pickBtn(fn,arg,name,sub){return'<button class="pick" data-a="'+esc(arg)+'" onclick="'+fn+'(this.dataset.a)"><span>'+esc(name)+'</span><small>'+sub+'</small></button>'}
function collegeView(){return'<h2 class="vt">Select your college</h2>'+(S.colleges.length?'<div class="picks">'+S.colleges.map(function(c){var n=S.branches.filter(function(b){return b.college_id===c.id}).length;return pickBtn("pickCollege",c.id,c.name,n+(n===1?' branch':' branches'))}).join("")+'</div>':'<div class="empty">No college is added yet. '+(S.staff?'Add one in the '+(S.admin?'CEO':'Manager')+' panel.':'To get yours added, email the admin from the About tab.')+'</div>')}
function branchView(){var bl=S.branches.filter(function(b){return b.college_id===cid});return crumb()+'<h2 class="vt">Select your branch</h2>'+(bl.length?'<div class="picks">'+bl.map(function(b){var n=S.posts.filter(function(p){return p.branch_id===b.id}).length;return pickBtn("pickBranch",b.id,b.name,n+(n===1?' note':' notes'))}).join("")+'</div>':'<div class="empty">No branch yet in this college.</div>')}
function subjectView(){var ns=subjectNames();return crumb()+'<h2 class="vt">Select a subject</h2>'+(ns.length?'<div class="picks">'+ns.map(function(s){var n=bPosts().filter(function(p){return p.subject===s}).length;return pickBtn("pickSubject",s,s,n+(n===1?' note':' notes'))}).join("")+'</div>':'<div class="empty small">No subjects yet. Add the first one below.</div>')+'<div class="panel" style="margin-top:14px"><label for="ns">Add a new subject</label><div class="cin"><input id="ns" maxlength="30" placeholder="Example: Python"><button class="btn" onclick="addSubject()">Add</button></div></div><div style="margin-bottom:12px"><button class="btn alt" onclick="showTop=!showTop;render()">Top contributors</button></div>'+(showTop?topHTML():'')}
function opt(v,l,cur){return'<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+l+'</option>'}
function notesView(){var h=crumb()+'<h2 class="vt">'+esc(sid)+'</h2><div class="bar"><button class="btn" onclick="showForm=!showForm;render()">'+(showForm?'Close':'Share notes')+'</button><select id="so" aria-label="Sort notes" onchange="sort=this.value;render()">'+opt("top","Top rated first",sort)+opt("new","Newest first",sort)+opt("likes","Most liked",sort)+'</select><select id="mr" aria-label="Minimum rating" onchange="minr=+this.value;render()">'+opt(0,"Any rating",minr)+opt(3,"3 stars and up",minr)+opt(4,"4 stars and up",minr)+'</select></div>';
if(showForm)h+='<div class="panel"><label for="pt">Title</label><input id="pt" maxlength="80"><label for="pu">Unit</label><input id="pu" placeholder="Unit 2" maxlength="20"><label for="pd">Short description</label><textarea id="pd" maxlength="200"></textarea><label for="pf">Notes (PDF, up to 5 MB)</label><input id="pf" type="file" accept="application/pdf"><p class="note">Posting to '+esc(nm(S.colleges,cid))+' &rsaquo; '+esc(nm(S.branches,bid))+' &rsaquo; '+esc(sid)+'. Viewers see a preview of your first page before downloading.</p><div style="margin-top:14px"><button class="btn" onclick="submitPost()">Post notes</button></div></div>';
return h+searchBox()+'<div id="list" class="grid">'+postsHTML()+'</div>'}
function searchBox(){return'<input id="q" type="search" placeholder="Search notes, unit or name" aria-label="Search notes" value="'+esc(q)+'" oninput="q=this.value;document.getElementById(\'list\').innerHTML=postsHTML()" style="margin-bottom:12px">'}
function aboutHTML(){return'<div class="panel"><h2 style="font-size:22px;margin-bottom:6px">About NoteKarma</h2><p style="margin:0 0 10px">NoteKarma is a notes-sharing website for college students. Share your notes, earn karma, and unlock your classmates\' notes. Every college has branches, and every branch has its own subjects.</p><p style="margin:0 0 10px"><b>Created by Deepankar Chaurasia.</b></p><p style="margin:0">Facing a problem, or want your college added? Email <a href="mailto:deepankarchaurasiya0@gmail.com">deepankarchaurasiya0@gmail.com</a></p></div><div class="panel"><h2 style="font-size:18px;margin-bottom:6px">How karma works</h2><ul style="margin:0;padding-left:20px"><li>New members start with 10 karma.</li><li>Downloading a note costs 2 karma.</li><li>When someone downloads your note, you earn 1 karma.</li><li>Rate notes you have downloaded, so the best ones come first.</li></ul></div><p class="note"><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>'}
function needBranch(){return'<div class="panel"><h2>Choose your branch first</h2><p style="color:var(--muted)">Pick your college and branch in the Notes tab, then come back here.</p><button class="btn" onclick="setTab(\'notes\')">Go to Notes</button></div>'}
var ICON={notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>',req:'<path d="M4 5h16v11H9l-5 4z"/>',saved:'<path d="M6 3h12v18l-6-4-6 4z"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',panel:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'};
function navHTML(){var t=[["notes","Notes"],["req","Requests"],["saved","Saved"],["about","About"]];if(S.staff)t.push(["panel",S.admin?"CEO":"Manager"]);return'<nav class="tabs" aria-label="Sections">'+t.map(function(x){return'<button class="tab'+(tab===x[0]?' on':'')+'" onclick="setTab(\''+x[0]+'\')" aria-current="'+(tab===x[0])+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[x[0]]+'</svg><span>'+x[1]+'</span></button>'}).join("")+'</nav>'}
function draw(){var app=document.getElementById("app"),h="";
if(!S.me){app.innerHTML='<header><h1>NoteKarma</h1></header><div class="panel"><h2>Join your class</h2><p style="color:var(--muted)">Share your notes. Earn karma. Unlock your classmates\' notes.</p><p class="note">Sign in with your Gmail. One account per person, and new members start with 10 karma.</p><div style="margin-top:12px"><button class="btn" onclick="login()">Continue with Google</button></div></div><p class="note"><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>';return}
h+='<header><h1>NoteKarma</h1><div class="who"><button class="coin'+(bumpNext?' bump':'')+'" onclick="showLed=!showLed;render()" aria-label="Karma history"><i></i><span id="bal">'+balTxt()+'</span></button><button class="link" onclick="logout()">'+esc(myName())+(S.admin?' (CEO)':S.role==="manager"?' (Manager)':'')+' (sign out)</button></div></header>';
bumpNext=false;
if(blocked()){app.innerHTML=h+'<div class="panel"><h2>Account blocked</h2><p style="color:var(--muted)">The admin has blocked this account, so you can not post, like, comment or download.</p></div>';return}
if(showLed){h+='<div class="panel"><h2 style="font-size:18px;margin-bottom:6px">Karma history</h2>';S.ledger.filter(function(e){return e.user_name===uid()}).sort(function(a,b){return b.id-a.id}).forEach(function(e){h+='<div class="led"><span>'+esc(e.why)+'</span><span class="'+(e.delta>0?'pos':'neg')+'">'+(e.delta>0?'+':'')+e.delta+'</span></div>'});h+='</div>'}
if(tab==="notes"){h+='<div id="notices">'+noticesHTML()+'</div>';h+=!cid?collegeView():!bid?branchView():!sid?subjectView():notesView()}
else if(tab==="req")h+=bid?reqHTML():needBranch();
else if(tab==="saved")h+='<h2 class="vt">Saved notes</h2>'+searchBox()+'<div id="list" class="grid">'+postsHTML()+'</div>';
else if(tab==="about")h+=aboutHTML();
else if(tab==="panel"&&S.staff)h+=admHTML();
app.innerHTML=h+navHTML()}
document.getElementById("app").innerHTML='<p class="empty">Loading...</p>';
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s){S.me=s.user;return loadAll().then(function(){sb.rpc("touch").then(function(){})})}}).then(render).catch(function(e){fail(e);render()});
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"){S.me=null;render()}});
setInterval(function(){if(!S.me||document.hidden||busy)return;loadAll().then(refresh).catch(function(){})},8000);
</script>
