function draw(){var app=document.getElementById("app"),h="";
if(!S.me){app.innerHTML='<header><h1>NoteKarma</h1></header><div class="panel"><h2>Join your class</h2><p style="color:var(--muted)">Share your notes. Earn karma. Unlock your classmates\' notes.</p><p class="note">Sign in with your Gmail. One account per person, and new members start with 10 karma.</p><div style="margin-top:12px"><button class="btn" onclick="login()">Continue with Google</button></div></div><p class="note"><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>';return}
h+='<header><h1>NoteKarma</h1><div class="who"><button class="coin'+(bumpNext?' bump':'')+'" onclick="showLed=!showLed;render()" aria-label="Karma history"><i></i><span id="bal">'+balTxt()+'</span></button>'+(S.admin?'<span class="badge">CEO</span>':S.role==="manager"?'<span class="badge">Manager</span>':'')+'<button class="avb" onclick="openProfile(null)" aria-label="My profile">'+avHTML(uid(),myName(),"sm")+'</button><button class="link" onclick="logout()">Sign out</button></div></header>';
bumpNext=false;
if(blocked()){app.innerHTML=h+'<div class="panel"><h2>Account blocked</h2><p style="color:var(--muted)">The admin has blocked this account, so you can not post, like, comment or download.</p></div>';return}
if(showLed){h+='<div class="panel"><h2 style="font-size:18px;margin-bottom:6px">Karma history</h2>';S.ledger.filter(function(e){return e.user_name===uid()}).sort(function(a,b){return b.id-a.id}).forEach(function(e){h+='<div class="led"><span>'+esc(e.why)+'</span><span class="'+(e.delta>0?'pos':'neg')+'">'+(e.delta>0?'+':'')+e.delta+'</span></div>'});h+='</div>'}
if(tab==="notes"){h+='<div id="notices">'+noticesHTML()+'</div>';h+=!cid?collegeView():!bid?branchView():(!semid&&hasSem())?semesterView():(hasGroups()&&!gid)?groupView():!sid?subjectView():notesView()}
else if(tab==="req")h+=bid?reqHTML():needBranch();
else if(tab==="saved")h+='<h2 class="vt">Saved notes</h2>'+searchBox()+'<div id="list" class="grid">'+postsHTML()+'</div>';
else if(tab==="about")h+=aboutHTML();else if(tab==="me")h+=profileHTML();else if(tab==="people")h+=peopleHTML();
else if(tab==="panel"&&S.staff)h+=admHTML();
app.innerHTML=h+navHTML()}
document.getElementById("app").innerHTML='<p class="empty">Loading...</p>';
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s){S.me=s.user;return loadAll().then(function(){sb.rpc("touch").then(function(){})})}}).then(render).catch(function(e){fail(e);render()});
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"){S.me=null;render()}});
setInterval(function(){if(!S.me||document.hidden||busy)return;loadAll().then(refresh).catch(function(){})},8000);
var peopleTab="students",roomId=null,chatMsgs=[],chatHidden={},msgMenu=null,chatDraft="",roomForm=false,showMembers=false,addQ="",chatSig="",lastSend=0;
function isMember(id){return S.rmembers.some(function(m){return m.room_id===id&&m.user_id===uid()})}
function roomOf(id){return S.rooms.filter(function(r){return r.id===id})[0]}
function mcount(id){return S.rmembers.filter(function(m){return m.room_id===id}).length}
function canMod(r){return !!r&&(r.created_by===uid()||S.staff)}
function setPeopleTab(t){peopleTab=t;roomId=null;showMembers=false;render()}
function peopleHTML(){return'<div class="seg" role="group" aria-label="People sections"><button class="chip" aria-pressed="'+(peopleTab==="students")+'" onclick="setPeopleTab(\'students\')">Students</button><button class="chip" aria-pressed="'+(peopleTab==="groups")+'" onclick="setPeopleTab(\'groups\')">Groups</button></div>'+(peopleTab==="groups"?(roomId?chatHTML():roomsHTML()):studentsHTML())}
function roomsHTML(){var mine=S.rooms.filter(function(r){return isMember(r.id)}),more=S.rooms.filter(function(r){return !isMember(r.id)&&(r.is_public||S.staff)});
var h='<h2 class="vt">Groups</h2><p class="note" style="margin:0 0 10px">Chat with classmates. Create a group, or join a public one.</p><button class="btn" onclick="roomForm=!roomForm;render()">'+(roomForm?'Close':'New group')+'</button>';
if(roomForm)h+='<div class="panel" style="margin-top:12px"><label for="rn">Group name</label><input id="rn" maxlength="40" placeholder="Example: BCA Sem 3 study group"><label for="ra">About (optional)</label><input id="ra" maxlength="120" placeholder="What is this group for?"><label for="rv">Who can join?</label><select id="rv"><option value="1">Public: anyone can find and join</option><option value="0">Private: only people you add</option></select><div style="margin-top:12px"><button class="btn" onclick="createRoom()">Create group</button></div></div>';
h+='<h3 class="sub">My groups</h3>'+(mine.length?'<div class="picks">'+mine.map(function(r){return'<button class="pick" data-a="'+esc(r.id)+'" onclick="openRoom(this.dataset.a)"><span style="text-align:left"><b>'+esc(r.name)+'</b>'+(r.is_public?'':' <small>(private)</small>')+'<br><small>'+esc(r.about||"")+'</small></span><small>'+mcount(r.id)+' members</small></button>'}).join("")+'</div>':'<div class="empty small">You are not in any group yet.</div>');
h+='<h3 class="sub">'+(S.staff?'Other groups':'Discover')+'</h3>'+(more.length?more.map(function(r){return'<div class="led" style="gap:8px"><span><b>'+esc(r.name)+'</b>'+(r.is_public?'':' <small>(private)</small>')+'<br><small style="color:var(--muted)">'+esc(r.about||"")+' | '+mcount(r.id)+' members</small></span>'+(r.is_public?'<button class="btn" onclick="joinRoom(\''+r.id+'\')">Join</button>':'<button class="btn alt" onclick="openRoom(\''+r.id+'\')">Open</button>')+'</div>'}).join(""):'<div class="empty small">No public groups to join right now.</div>');
return h}
function createRoom(){var n=document.getElementById("rn").value.trim(),a=document.getElementById("ra").value.trim(),pub=document.getElementById("rv").value==="1";if(n.length<2){toast("Group name needs at least 2 characters.");return}sb.rpc("create_room",{p_name:n,p_about:a,p_public:pub}).then(done).then(function(r){roomForm=false;return loadAll().then(function(){openRoom(r.data)})}).catch(fail)}
function joinRoom(id){sb.rpc("join_room",{p_room:id}).then(done).then(loadAll).then(function(){toast("Joined the group.");openRoom(id)}).catch(fail)}
function leaveRoom(id){if(!confirm("Leave this group?"))return;sb.rpc("leave_room",{p_room:id}).then(done).then(function(){roomId=null;showMembers=false;return reload("You left the group.")}).catch(fail)}
function delRoom(id){if(!confirm("Delete this group and all its messages for everyone?"))return;sb.from("chat_rooms").delete().eq("id",id).then(done).then(function(){roomId=null;showMembers=false;return reload("Group deleted.")}).catch(fail)}
function addMember(u){sb.rpc("add_room_member",{p_room:roomId,p_user:u}).then(done).then(function(){return reload("Added to the group.")}).catch(fail)}
function removeMember(u){if(!confirm("Remove this person from the group?"))return;sb.rpc("remove_room_member",{p_room:roomId,p_user:u}).then(done).then(function(){return reload("Removed from the group.")}).catch(fail)}
function openRoom(id){tab="people";peopleTab="groups";roomId=id;showMembers=false;msgMenu=null;chatMsgs=[];chatHidden={};chatDraft="";chatSig="";window.scrollTo(0,0);render();fetchMsgs(true)}
function closeRoom(){roomId=null;showMembers=false;render()}
function addResHTML(){var r=roomOf(roomId),ql=addQ.trim().toLowerCase();if(!r||!ql)return'<div class="note">Type a name to find people.</div>';var cs=S.cards.filter(function(c){return !S.rmembers.some(function(m){return m.room_id===roomId&&m.user_id===c.id})&&String(c.name||"").toLowerCase().indexOf(ql)>-1}).slice(0,8);return cs.length?cs.map(function(c){return'<div class="led" style="align-items:center">'+'<span style="display:flex;gap:8px;align-items:center">'+avHTML(c.id,c.name,"sm")+esc(c.name||"Student")+'</span><button class="btn alt" data-a="'+esc(c.id)+'" onclick="addMember(this.dataset.a)">Add</button></div>'}).join(""):'<div class="note">No one found.</div>'}
function membersHTML(r){var ms=S.rmembers.filter(function(m){return m.room_id===r.id}),mod=canMod(r),h='<div class="panel"><h2 style="font-size:17px;margin-bottom:6px">Members ('+ms.length+')</h2>'+ms.map(function(m){var owner=m.user_id===r.created_by;return'<div class="led" style="align-items:center"><span style="display:flex;gap:8px;align-items:center">'+avHTML(m.user_id,"",'sm')+esc(uname(m.user_id,"Student"))+(owner?' <span class="badge">Owner</span>':'')+'</span>'+(mod&&!owner?'<button class="btn danger" data-a="'+esc(m.user_id)+'" onclick="removeMember(this.dataset.a)">Remove</button>':'')+'</div>'}).join("");
if(mod)h+='<label for="addq">Add people</label><input id="addq" placeholder="Search students" value="'+esc(addQ)+'" oninput="addQ=this.value;document.getElementById(\'addres\').innerHTML=addResHTML()"><div id="addres" style="margin-top:6px">'+addResHTML()+'</div>';
h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+(isMember(r.id)&&r.created_by!==uid()?'<button class="btn alt" onclick="leaveRoom(\''+r.id+'\')">Leave group</button>':'')+(mod?'<button class="btn danger" onclick="delRoom(\''+r.id+'\')">Delete group</button>':'')+'</div></div>';return h}
function chatHTML(){var r=roomOf(roomId);if(!r){roomId=null;return roomsHTML()}var h='<div class="chead"><button class="link" onclick="closeRoom()">&lsaquo; Groups</button><div style="text-align:center;flex:1"><b>'+esc(r.name)+'</b><br><small style="color:var(--muted)">'+mcount(r.id)+' members'+(r.is_public?'':' | private')+'</small></div><button class="btn alt" onclick="showMembers=!showMembers;render()">Members</button></div>';
if(showMembers)h+=membersHTML(r);
h+='<div id="chatlog" class="chatlog" aria-live="polite">'+chatLogHTML()+'</div>';
h+=isMember(r.id)?'<div class="cin chatin"><input id="cmsg" maxlength="1000" placeholder="Message" aria-label="Message" value="'+esc(chatDraft)+'" oninput="chatDraft=this.value" onkeydown="if(event.key===\'Enter\')sendMsg()"><button class="btn" onclick="sendMsg()">Send</button></div>':'<p class="note">You are viewing this group as staff. Join is not needed to moderate.</p>';
return h}
function chatLogHTML(){var r=roomOf(roomId),mod=canMod(r),ms=chatMsgs.filter(function(m){return !chatHidden[m.id]});if(!ms.length)return'<div class="empty small">No messages yet. Say hello.</div>';
var today=new Date().toDateString();return ms.map(function(m){var mine=m.user_id===uid(),t=new Date(m.created_at),tm=isNaN(t)?"":(t.toDateString()===today?"":t.toLocaleDateString([],{day:"numeric",month:"short"})+" ")+t.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),body=m.deleted?'<i class="del">'+(mine?"You deleted this message":"This message was deleted")+'</i>':esc(m.body),menu=msgMenu===m.id?'<div class="mm"><button class="link" onclick="hideMsg(\''+m.id+'\')">Delete for me</button>'+((mine||mod)&&!m.deleted?'<button class="link" onclick="delMsgAll(\''+m.id+'\')">Delete for everyone</button>':'')+'</div>':'';
return'<div class="msg'+(mine?' me':'')+'">'+(mine?'':avHTML(m.user_id,m.user_name,"sm"))+'<div class="bub"><div class="who">'+esc(uname(m.user_id,m.user_name))+'</div>'+body+'<div class="mt"><span>'+esc(tm)+'</span><button class="dots" onclick="toggleMsgMenu(\''+m.id+'\')" aria-label="Message options">&#8942;</button></div>'+menu+'</div></div>'}).join("")}
function paintChat(force){var el=document.getElementById("chatlog");if(!el)return;var near=el.scrollHeight-el.scrollTop-el.clientHeight<80;el.innerHTML=chatLogHTML();if(force||near)el.scrollTop=el.scrollHeight}
function fetchMsgs(force){var rid=roomId;if(!rid)return Promise.resolve();return Promise.all([sb.from("chat_messages").select("*").eq("room_id",rid).order("created_at",{ascending:false}).limit(200),sb.from("chat_hidden").select("message_id")]).then(function(r){if(rid!==roomId)return;var ms=(r[0].error?[]:(r[0].data||[])).slice().reverse(),hid={};(r[1].error?[]:(r[1].data||[])).forEach(function(x){hid[x.message_id]=1});var sg=ms.map(function(m){return m.id+(m.deleted?"d":"")}).join(",")+"|"+Object.keys(hid).length;if(force||sg!==chatSig){chatSig=sg;chatMsgs=ms;chatHidden=hid;paintChat(force)}}).catch(function(){})}
function sendMsg(){var el=document.getElementById("cmsg");if(!el||blocked())return;var b=el.value.trim();if(!b||Date.now()-lastSend<600)return;lastSend=Date.now();el.value="";chatDraft="";sb.from("chat_messages").insert({room_id:roomId,user_id:uid(),user_name:myName(),body:b.slice(0,1000)}).then(done).then(function(){return fetchMsgs(true)}).catch(function(e){el.value=b;chatDraft=b;fail(e)})}
function toggleMsgMenu(id){msgMenu=msgMenu===id?null:id;paintChat(false)}
function hideMsg(id){msgMenu=null;chatHidden[id]=1;paintChat(false);sb.from("chat_hidden").insert({user_id:uid(),message_id:id}).then(function(r){if(r.error){delete chatHidden[id];fail(r.error);paintChat(false)}})}
function delMsgAll(id){if(!confirm("Delete this message for everyone?"))return;msgMenu=null;sb.rpc("delete_message_everyone",{p_msg:id}).then(done).then(function(){return fetchMsgs(true)}).catch(fail)}
function swipeNav(d){var a=document.getElementById("app"),cls="";if(d==="left"&&tab==="notes"){tab="people";roomId=null;cls="sl"}else if(d==="right"&&tab==="people"){if(roomId){roomId=null;showMembers=false}else tab="notes";cls="sr"}else return;window.scrollTo(0,0);render();if(a&&a.classList){a.classList.remove("sl","sr");void a.offsetWidth;a.classList.add(cls)}}
var tsX=0,tsY=0,tsT=0,tsOk=false;
document.addEventListener("touchstart",function(e){var t=e.touches[0];tsX=t.clientX;tsY=t.clientY;tsT=Date.now();var el=e.target;tsOk=!(el&&el.closest&&el.closest("input,textarea,select,.strip,.chips,.chatin"))},{passive:true});
document.addEventListener("touchend",function(e){if(!tsOk||!S.me||blocked())return;var t=e.changedTouches[0],dx=t.clientX-tsX,dy=t.clientY-tsY;if(Date.now()-tsT>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;swipeNav(dx<0?"left":"right")},{passive:true});
setInterval(function(){if(!S.me||document.hidden||busy)return;if(tab==="people"&&peopleTab==="groups"&&roomId)fetchMsgs(false)},3000);
</script>
</body>
</html>
