<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusKarma Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#0C111C;color:#EEF2FA;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:20px 0 8px}
input,button{font:inherit;padding:12px;border-radius:10px;border:1.5px solid #27314A;background:#151C2B;color:#EEF2FA;width:100%;margin:4px 0}
button{background:#3DB6F2;color:#05101a;font-weight:700;border:0;cursor:pointer}
button.alt{background:#27314A;color:#EEF2FA}
.card{background:#151C2B;border:1.5px solid #27314A;border-radius:14px;padding:14px;margin:10px 0}
.big{font-size:34px;font-weight:800;color:#F5B91E}
#log{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;background:#05080f;border-radius:10px;padding:10px;min-height:80px}
.room{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #27314A}
.room button{width:auto;padding:8px 14px}
</style>
</head>
<body>
<h1>FocusKarma test</h1>

<div class="card" id="cfg">
  <b>1. Supabase connect</b>
  <input id="url" placeholder="Project URL (https://xxxx.supabase.co)">
  <input id="key" placeholder="anon / publishable key">
  <button id="saveCfg">Save and connect</button>
</div>

<div class="card" id="auth" hidden>
  <b>2. Login (NoteKarma account)</b>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <button id="login">Log in</button>
</div>

<div id="app" hidden>
  <div class="card">Your Karma<div class="big" id="bal">–</div>
    <button class="alt" id="refresh">Refresh balance</button></div>

  <div class="card">
    <b>Test room</b>
    <button id="mk1">Create 1 minute room (starts in 2 min)</button>
    <button class="alt" id="mk25">Create 25 minute room</button>
    <h2>Open rooms</h2><div id="rooms">–</div>
  </div>

  <div class="card" id="live" hidden>
    <b id="liveTitle">In room</b>
    <div class="big" id="timer">--:--</div>
    <div id="liveMsg">Stay on this tab. Switching tabs forfeits your stake.</div>
    <button class="alt" id="leave">Leave room (forfeit)</button>
  </div>
</div>

<h2>Log</h2><div id="log"></div>

<script>
var $=function(i){return document.getElementById(i)};
var sb=null,roomId=null,hb=null,tm=null,endsAt=null,startsAt=null;
function log(t){$('log').textContent=new Date().toLocaleTimeString()+'  '+t+'\n'+$('log').textContent}
function fmt(ms){ms=Math.max(0,ms);var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}

function connect(){
  var u=localStorage.getItem('fk_url'),k=localStorage.getItem('fk_key');
  if(!u||!k)return;
  $('url').value=u;$('key').value=k;
  sb=supabase.createClient(u,k);
  $('auth').hidden=false;
  sb.auth.getSession().then(function(r){if(r.data.session)ready()});
}
$('saveCfg').onclick=function(){
  localStorage.setItem('fk_url',$('url').value.trim());
  localStorage.setItem('fk_key',$('key').value.trim());
  connect();log('Connected config saved.');
};
$('login').onclick=function(){
  sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value}).then(function(r){
    if(r.error)return log('Login error: '+r.error.message);
    log('Logged in.');ready();
  });
};
function ready(){$('app').hidden=false;$('auth').hidden=true;$('cfg').hidden=true;balance();loadRooms()}

function balance(){
  sb.rpc('my_karma').then(function(r){
    if(r.error)return log('Balance error: '+r.error.message);
    $('bal').textContent=r.data;
  });
}
$('refresh').onclick=balance;

function mk(d){
  sb.rpc('create_room',{p_duration:d}).then(function(r){
    if(r.error)return log('Create error: '+r.error.message);
    log('Room created.');loadRooms();
  });
}
$('mk1').onclick=function(){mk(1)};
$('mk25').onclick=function(){mk(25)};

function loadRooms(){
  sb.from('focus_room_overview').select('*').eq('status','scheduled')
    .gt('starts_at',new Date().toISOString()).order('starts_at').then(function(r){
    if(r.error)return log('Rooms error: '+r.error.message);
    var box=$('rooms');box.innerHTML='';
    if(!r.data.length){box.textContent='No open rooms. Create one above.';return}
    r.data.forEach(function(x){
      var d=document.createElement('div');d.className='room';
      d.innerHTML='<span>'+x.duration_min+' min · '+x.players+' in · stake '+x.stake+'<br><small>starts '+new Date(x.starts_at).toLocaleTimeString()+'</small></span>';
      var b=document.createElement('button');b.textContent='Join';
      b.onclick=function(){join(x)};d.appendChild(b);box.appendChild(d);
    });
  });
}

function join(x){
  sb.rpc('join_room',{p_room:x.id}).then(function(r){
    if(r.error)return log('Join error: '+r.error.message);
    log('Joined. 10 Karma staked.');balance();
    roomId=x.id;startsAt=new Date(x.starts_at);endsAt=new Date(x.ends_at);
    $('live').hidden=false;$('liveTitle').textContent='In room ('+x.duration_min+' min)';
    hb=setInterval(function(){sb.rpc('room_heartbeat',{p_room:roomId}).then(function(r){if(r.error)log('HB error: '+r.error.message)})},15000);
    sb.rpc('room_heartbeat',{p_room:roomId});
    tm=setInterval(tick,500);tick();
  });
}
function tick(){
  var now=new Date();
  if(now<startsAt){$('timer').textContent=fmt(startsAt-now);$('liveMsg').textContent='Room starts soon. Stay on this tab.';return}
  if(now<endsAt){$('timer').textContent=fmt(endsAt-now);$('liveMsg').textContent='Focusing. Do not switch tabs.';return}
  finish();
}
function stopLive(){clearInterval(hb);clearInterval(tm);var id=roomId;roomId=null;return id}
function finish(){
  var id=stopLive();if(!id)return;
  $('timer').textContent='00:00';$('liveMsg').textContent='Settling...';
  setTimeout(function(){
    sb.rpc('settle_room',{p_room:id}).then(function(r){
      if(r.error)log('Settle error: '+r.error.message);
      else log('Room settled. Check your balance.');
      $('liveMsg').textContent='Done.';balance();loadRooms();
    });
  },12000);
}
function abandon(why){
  var id=stopLive();if(!id)return;
  sb.rpc('abandon_room',{p_room:id}).then(function(r){
    if(r.error)return log('Abandon error: '+r.error.message);
    log(why+' Stake forfeited.');$('liveMsg').textContent='You left. Stake lost.';balance();
  });
}
$('leave').onclick=function(){abandon('You left the room.')};
document.addEventListener('visibilitychange',function(){if(document.hidden&&roomId)abandon('Tab switched.')});

connect();
</script>
</body>
</html>
